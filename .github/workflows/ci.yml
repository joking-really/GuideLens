name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  desktop-rust:
    name: Desktop (Rust) — clippy + test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # tauri::generate_context! requires the frontend dist folder to exist.
      - name: Build frontend (for frontendDist)
        working-directory: apps/desktop
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
          npm run build

      - name: cargo fmt --check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo clippy (-D warnings)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  desktop-web:
    name: Desktop (TS) — tsc + vitest + build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        run: if (Test-Path package-lock.json) { npm ci } else { npm install }
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build

  mcp:
    name: guidelens-mcp — build + test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: packages/guidelens-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/guidelens-mcp/package-lock.json
      - name: Install
        run: if (Test-Path package-lock.json) { npm ci } else { npm install }
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  cloud:
    name: Cloud proxy — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt
          elif [ -f pyproject.toml ]; then pip install -e ".[dev]"
          else pip install -r requirements.txt; fi
          pip install ruff pytest pip-audit
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true
      - name: Pytest (mocked Groq/Supabase/Stripe — no real secrets)
        run: pytest -q
      - name: pip-audit
        run: |
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; else pip-audit; fi

  benchmark-selftest:
    name: IoU benchmark — self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate cases + IoU math (no network)
        run: |
          python benchmarks/run_benchmark.py --validate-only
          python -m unittest discover -s benchmarks/tests -v

  audit:
    name: Dependency audit (npm + cargo)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (desktop)
        working-directory: apps/desktop
        run: |
          if (Test-Path package-lock.json) { npm audit --audit-level=high --omit=dev } else { Write-Host "no lockfile, skipping" }
      - name: npm audit (guidelens-mcp)
        working-directory: packages/guidelens-mcp
        run: |
          if (Test-Path package-lock.json) { npm audit --audit-level=high --omit=dev } else { Write-Host "no lockfile, skipping" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: apps/desktop/src-tauri
        run: cargo audit
