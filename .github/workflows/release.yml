name: Release Windows Installer & Updater Manifest

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"

jobs:
  pre-release-checks:
    name: Pre-release checks (CI + IoU benchmark validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate benchmark cases & IoU harness
        run: |
          python benchmarks/run_benchmark.py --validate-only
          python -m unittest discover -s benchmarks/tests -v

  release-windows:
    name: Build, Sign & Publish Windows (NSIS + MSI + latest.json)
    needs: pre-release-checks
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Run frontend + Rust tests before packaging
        working-directory: apps/desktop
        run: |
          npx tsc --noEmit
          npx vitest run
          npm run build
          Push-Location src-tauri
          if (Test-Path Cargo.lock) {
            cargo clippy --all-targets --locked -- -D warnings
            cargo test --locked
          } else {
            cargo clippy --all-targets -- -D warnings
            cargo test
          }
          Pop-Location

      - name: Configure Windows Authenticode signCommand (before updater signing)
        id: authenticode
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $baseArgs = "--target x86_64-pc-windows-msvc --bundles nsis,msi"
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) {
              Write-Error "signtool.exe not found in Windows SDK"
              exit 1
            }

            Write-Host "Decoding WINDOWS_CERTIFICATE into temporary PFX for Tauri signCommand..."
            $pfxPath = Join-Path $env:RUNNER_TEMP "guidelens-authenticode.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

            $signScript = Join-Path $env:RUNNER_TEMP "sign-artifact.ps1"
            $scriptLines = @(
              'param([Parameter(Mandatory=$true)][string]$TargetPath)'
              'Write-Host "Authenticode signing $TargetPath..."'
              ('& "{0}" sign /f "$env:PFX_PATH" /p "$env:WINDOWS_CERTIFICATE_PASSWORD" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "$TargetPath"' -f $signtool)
              'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
            )
            Set-Content -Path $signScript -Value ($scriptLines -join "`r`n") -Encoding UTF8

            $signConfigPath = Join-Path $env:RUNNER_TEMP "tauri.sign.conf.json"
            $signConfigJson = @{
              bundle = @{
                windows = @{
                  signCommand = @{
                    cmd  = "pwsh"
                    args = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $signScript, "%1")
                  }
                }
              }
            } | ConvertTo-Json -Depth 5
            Set-Content -Path $signConfigPath -Value $signConfigJson -Encoding UTF8

            "PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append
            "SIGN_SCRIPT_PATH=$signScript" | Out-File -FilePath $env:GITHUB_ENV -Append
            "SIGN_CONF_PATH=$signConfigPath" | Out-File -FilePath $env:GITHUB_ENV -Append
            "tauri_args=$baseArgs --config `"$signConfigPath`"" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "WINDOWS_CERTIFICATE not set — building unsigned installers (placeholder secret mode)."
            "tauri_args=$baseArgs" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build, Authenticode-sign, Ed25519-sign & Publish NSIS + MSI + latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Tauri Ed25519 updater signing keys (generated via `npx @tauri-apps/cli signer generate`)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "GuideLens ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            ## GuideLens ${{ inputs.tag || github.ref_name }} (Windows 10/11 x64)

            ### Installers
            - **NSIS Setup (`.exe`)**: Per-user installer with automatic silent delta updates
            - **MSI Package (`.msi`)**: Enterprise Windows Installer package
            - **Updater Manifest (`latest.json`)**: Ed25519-signed Tauri auto-updater feed
          releaseDraft: false
          prerelease: false
          args: ${{ steps.authenticode.outputs.tauri_args }}

      - name: Cleanup temporary signing files
        if: always()
        run: |
          foreach ($varName in @("PFX_PATH", "SIGN_SCRIPT_PATH", "SIGN_CONF_PATH")) {
            $p = [Environment]::GetEnvironmentVariable($varName)
            if ($p -and (Test-Path $p)) {
              Remove-Item -Force $p
            }
          }
